[package]
name = "kwsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

default-run = "kwsh"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"
tempfile = "3"
base64 = "0.22"
form_urlencoded = "1"
httparse = "1"
jsonwebtoken = { version = "9", default-features = false }
ring = "0.17"
ureq = { version = "~3.3.0", default-features = false, features = ["rustls", "json"] }
